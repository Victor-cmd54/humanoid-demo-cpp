<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="700" y="44" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#12344d">Humanoid Demo - UML Controller Overview</text>

  <g font-family="Segoe UI,Arial,sans-serif" font-size="16">
    <rect x="50" y="90" width="300" height="210" rx="8" fill="#eef6fb" stroke="#12344d" stroke-width="2"/>
    <rect x="50" y="90" width="300" height="44" fill="#12344d"/>
    <text x="200" y="118" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">ControllerBase</text>
    <text x="70" y="165" font-family="Consolas,monospace">&lt;&lt;abstract&gt;&gt;</text>
    <line x1="50" y1="180" x2="350" y2="180" stroke="#12344d"/>
    <text x="70" y="215" font-family="Consolas,monospace">+ execute(): void</text>
    <text x="70" y="250" font-family="Consolas,monospace">+ ~ControllerBase()</text>

    <rect x="430" y="90" width="420" height="300" rx="8" fill="#e8f4e8" stroke="#2d6a3f" stroke-width="2"/>
    <rect x="430" y="90" width="420" height="44" fill="#2d6a3f"/>
    <text x="640" y="118" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">HumanoidController</text>
    <text x="450" y="165" font-family="Consolas,monospace">- motors_: Motor map</text>
    <text x="450" y="195" font-family="Consolas,monospace">- canfd_: CommunicationBase*</text>
    <text x="450" y="225" font-family="Consolas,monospace">- ethercat_: CommunicationBase*</text>
    <text x="450" y="255" font-family="Consolas,monospace">- ros_node_: Ros2Node</text>
    <text x="450" y="285" font-family="Consolas,monospace">- micro_ros_: MicroRosClient</text>
    <line x1="430" y1="300" x2="850" y2="300" stroke="#2d6a3f"/>
    <text x="450" y="330" font-family="Consolas,monospace">+ set_phase(GaitPhase): void</text>
    <text x="450" y="360" font-family="Consolas,monospace">+ execute(): void</text>

    <line x1="350" y1="195" x2="430" y2="195" stroke="#12344d" stroke-width="2"/>
    <path d="M 420 185 L 430 195 L 420 205 Z" fill="#ffffff" stroke="#12344d" stroke-width="2"/>

    <rect x="50" y="430" width="300" height="230" rx="8" fill="#fff7e6" stroke="#9a6700" stroke-width="2"/>
    <rect x="50" y="430" width="300" height="44" fill="#9a6700"/>
    <text x="200" y="458" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">MotorBase</text>
    <text x="70" y="500" font-family="Consolas,monospace"># name_: string</text>
    <text x="70" y="530" font-family="Consolas,monospace"># rated_torque_Nm_: double</text>
    <line x1="50" y1="545" x2="350" y2="545" stroke="#9a6700"/>
    <text x="70" y="575" font-family="Consolas,monospace">+ actuate(double): void</text>

    <rect x="50" y="720" width="300" height="110" rx="8" fill="#fff7e6" stroke="#9a6700" stroke-width="2"/>
    <text x="200" y="750" text-anchor="middle" font-size="18" font-weight="700">LegMotor</text>
    <text x="200" y="780" text-anchor="middle" font-size="18" font-weight="700">ArmMotor</text>
    <line x1="200" y1="660" x2="200" y2="720" stroke="#9a6700" stroke-width="2"/>
    <path d="M 190 710 L 200 720 L 210 710 Z" fill="#ffffff" stroke="#9a6700" stroke-width="2"/>

    <rect x="930" y="90" width="420" height="210" rx="8" fill="#f3ecfb" stroke="#6f42c1" stroke-width="2"/>
    <rect x="930" y="90" width="420" height="44" fill="#6f42c1"/>
    <text x="1140" y="118" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">CommunicationBase</text>
    <text x="950" y="165" font-family="Consolas,monospace">&lt;&lt;abstract&gt;&gt;</text>
    <line x1="930" y1="180" x2="1350" y2="180" stroke="#6f42c1"/>
    <text x="950" y="215" font-family="Consolas,monospace">+ transmit(vector&lt;uint8_t&gt;): void</text>

    <rect x="930" y="360" width="420" height="150" rx="8" fill="#f3ecfb" stroke="#6f42c1" stroke-width="2"/>
    <text x="1140" y="395" text-anchor="middle" font-size="18" font-weight="700">CANFDInterface</text>
    <text x="1140" y="425" text-anchor="middle" font-size="18" font-weight="700">EtherCATInterface</text>
    <text x="950" y="465" font-family="Consolas,monospace">+ transmit(std::vector&lt;std::uint8_t&gt;)</text>
    <line x1="1140" y1="300" x2="1140" y2="360" stroke="#6f42c1" stroke-width="2"/>
    <path d="M 1130 350 L 1140 360 L 1150 350 Z" fill="#ffffff" stroke="#6f42c1" stroke-width="2"/>
    <line x1="850" y1="195" x2="930" y2="195" stroke="#6f42c1" stroke-width="2"/>

    <rect x="930" y="570" width="420" height="180" rx="8" fill="#eaf8f8" stroke="#087e8b" stroke-width="2"/>
    <rect x="930" y="570" width="420" height="44" fill="#087e8b"/>
    <text x="1140" y="598" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">GaitPhase</text>
    <text x="950" y="640" font-family="Consolas,monospace">STAND | WALK | RUN | JUMP | NAVIGATE</text>
    <line x1="930" y1="655" x2="1350" y2="655" stroke="#087e8b"/>
    <text x="950" y="690" font-family="Consolas,monospace">Ros2Node</text>
    <text x="950" y="720" font-family="Consolas,monospace">MicroRosClient</text>

    <rect x="430" y="450" width="420" height="300" rx="8" fill="#f4f7fa" stroke="#475569" stroke-width="2"/>
    <text x="640" y="485" text-anchor="middle" font-size="20" font-weight="700" fill="#475569">execute() control sequence</text>
    <g fill="#dbeafe" stroke="#2563eb" stroke-width="2">
      <rect x="470" y="515" width="340" height="42" rx="6"/><text x="640" y="542" text-anchor="middle" fill="#172554">1. Read gait phase</text>
      <rect x="470" y="565" width="340" height="42" rx="6"/><text x="640" y="592" text-anchor="middle" fill="#172554">2. Command left/right hip motors</text>
      <rect x="470" y="615" width="340" height="42" rx="6"/><text x="640" y="642" text-anchor="middle" fill="#172554">3. Transmit CAN-FD frame</text>
      <rect x="470" y="665" width="340" height="42" rx="6"/><text x="640" y="692" text-anchor="middle" fill="#172554">4. Transmit EtherCAT frame</text>
      <rect x="470" y="715" width="340" height="42" rx="6"/><text x="640" y="742" text-anchor="middle" fill="#172254">5. Publish ROS2 / microROS status</text>
    </g>
  </g>
</svg>
